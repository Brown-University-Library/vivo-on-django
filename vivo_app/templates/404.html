{% extends 'base.html' %}
{% load static %}

{% block title %}Page not found{% endblock %}

{% block content %}
<div class="error-404-wrapper">
    <h1>Page not found</h1>
    <p>The page that you are looking for does not exist. Try going to the
        <a href="{% url 'home' %}">home page</a> or
        <a href="{% url 'search' %}">searching for a researcher</a>.</p>
<div class="row hero" style="background-image: url({% static hero_background_relpath %}); background-size: cover; background-position: 50% 50%; background-repeat: no-repeat;">
    <div class="theme-showcase"><div class="col-md-12"><div class="container" role="main">
        <div class="jumbotron"><img src="{% static 'images/RaB-type2.svg' %}" alt="Researchers at Brown" style="width: 64%; padding-bottom: 0; margin-bottom: 0;"></div>
        <form id="search-homepage" action="{% url 'search' %}" name="search-home" role="search" method="get">
            <div class="input-group input-group-lg">
                <input class="form-control" id="q" name="q" placeholder="Search for an expert..." aria-label="Enter text to search for a researcher or an organization at Brown" type="text" autofocus>
                <div class="input-group-btn"><button type="submit" class="btn btn-default btn-lg sympl-search"><span class="glyphicon glyphicon-search" aria-hidden="true"></span><span>Search</span></button></div>
            </div>
        </form>
    </div></div></div>
</div>
</div>
{% endblock %}
