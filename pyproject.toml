[project]
name = "vivo-on-django-project"
version = "0.0.0"
description = "Front-end for VIVO."
readme = "README.md"
requires-python = ">=3.12.16,<3.13"
dependencies = [
    "Django~=5.2.0",
    "django-browser-reload>=1.21.0",
    "httpx2~=2.16.0",
    "python-dotenv>=1.1,<1.3",
    "trio~=0.30.0",
]

[dependency-groups]
local = [
    "pillow==13.0.0",
    "playwright>=1.63,<2",
]
staging = [ 
    "pymysql~=1.2.0",  # reads the separate homepage book database
    "pillow==13.0.0",  # includes a wheel for older Linux systems used during staging checks
    ]
prod = [ 
    "pymysql~=1.2.0",
    ]
