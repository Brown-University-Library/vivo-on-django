[project]
name = "vivo-on-django-project"
version = "0.0.0"
description = "Front-end for VIVO."
readme = "coming"
requires-python = ">=3.12,<3.13"
dependencies = [
    "Django~=5.2.0",
    "django-browser-reload>=1.21.0",
    "python-dotenv~=1.1.0",
    "trio~=0.30.0",
]

[dependency-groups]
local = []
staging = [ 
    "mysqlclient~=2.2.0",  # not yet used on dev, but useful to confirm installation
    ]
prod = [ 
    "mysqlclient~=2.2.0", 
    ]
dev = [
    "pillow>=11,<13",
    "playwright>=1.63,<2",
]
